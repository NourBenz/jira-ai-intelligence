repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: python -m ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: python -m ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: python -m mypy app main.py scripts
        language: system
        pass_filenames: false
        types: [python]
