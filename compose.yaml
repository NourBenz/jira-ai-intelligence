services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg17
    restart: unless-stopped
    env_file:
      - .env.postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - jira_ai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
    env_file:
      - .env
      - .env.postgres
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
      - .env.postgres
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/container-health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  jira_ai_postgres_data:
